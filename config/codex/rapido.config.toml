# Perfil de agente (rapido). Lo usa central correr. Equivale a: tareas triviales: renombrar, boilerplate, formateo
model = "gpt-5.6-luna"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
writable_roots = ["__HOME__/agentes/locks", "__HOME__/agentes/contexto", "__HOME__/.cache/uv"]
network_access = true
