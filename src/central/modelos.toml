# Gemini va por Antigravity (agy), con el login de Google: no hace falta GEMINI_API_KEY.
# `modelo` es el nombre exacto que acepta agy (`sub --modelos`); `id` es el corto para central.
[[modelo]]
backend = "agy"
id = "gemini-4-hydrogen"
modelo = "Gemini 4 Hydrogen (High)"
para-que-sirve = "Análisis y tareas generales"
costo = "medio"

