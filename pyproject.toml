[project]
name = "claude-central"
version = "0.1.0"
description = "Central: coordinación de agentes de IA (registro de eventos, ejecutor multi-backend, permisos, visor)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
central = "central.cli:main"

[project.optional-dependencies]
ui = ["PyQt6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/central"]

[dependency-groups]
dev = ["pytest"]
