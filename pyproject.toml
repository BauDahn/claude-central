[project]
name = "claude-central"
version = "0.1.0"
description = "Central: coordinación de agentes de IA (registro de eventos, ejecutor multi-backend, permisos, voz, visor)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
station = "agent_station.cli:main"

[project.optional-dependencies]
ui = ["PyQt6"]
voice = ["kokoro-onnx", "faster-whisper", "soundfile", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_station"]

[dependency-groups]
dev = ["pytest"]
